# Project-local integration. Install with python CITRUS_WORLD/scripts/setup-blender-mcp.py.
# Start the dedicated Blender bridge before using scene tools.
[mcp_servers.blender]
command = "node"
args = ["CITRUS_WORLD/scripts/blender-mcp-server.mjs"]
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled_tools = ["get_scene_info", "get_object_info", "get_viewport_screenshot", "execute_blender_code"]

[mcp_servers.blender.env]
DISABLE_TELEMETRY = "true"
BLENDER_HOST = "127.0.0.1"
BLENDER_PORT = "9876"
PYTHONUTF8 = "1"
