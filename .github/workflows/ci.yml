name: Verify project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CITRUS_WORLD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CITRUS_WORLD/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run spec:validate
      - uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: CITRUS_WORLD/dist
