schema: spec-driven
context: |
  Repository: babylon-lite-astra-blender-demo.
  Minimal Babylon.js, TypeScript, Vite static web application, no UI library.
  WebGPU preferred with WebGL fallback. Local development binds to loopback.
  C001 owns setup and toolchain; C002 world, C003 character, C004 integration are separate.
  Application home is CITRUS_WORLD/. Run npm commands with --prefix CITRUS_WORLD from the repository root.
  Follow CITRUS_WORLD/documentation/asset-contract.md for GLB coordinates, paths and navigation.
  Canonical planning is .openspec/. The ignored local openspec alias points to the same files.
  Run CLI commands via npm --prefix CITRUS_WORLD run spec -- <arguments>.
  Keep template history and attribution in .openspec/history/template/; it is not active Citrus planning.
  Blender and MCP tooling stay project-local. Never commit credentials or local tooling.
rules:
  tasks:
    - Prefix task descriptions with their change ID (C001 onward) and record verification evidence.
