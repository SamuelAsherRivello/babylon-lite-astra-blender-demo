<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e7eae3" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='37' r='24' fill='%23e9a263'/%3E%3Cpath d='M32 14Q35 0 49 6Q44 19 32 14' fill='%237c9c70'/%3E%3C/svg%3E" />
    <title>Babylon Lite Astra Blender Demo</title>
  </head>
  <body>
    <main class="game" aria-label="Citrus World floating village">
      <canvas id="renderCanvas" tabindex="0" aria-label="Floating village. WASD to walk, drag to orbit, scroll to zoom."></canvas>
      <header class="heading"><h1>Citrus World</h1><p class="heading-subtitle">Babylon Lite Astra Blender Demo</p></header>
      <div id="loading" class="loading"><span class="loading-dot"></span><p id="status" role="status">Growing your little world…</p><button id="retry" hidden>Try again</button></div>
      <footer class="controls"><div id="joystick" class="joystick" role="group" aria-label="Movement joystick. Drag to walk or use WASD."><i class="direction up">⌃</i><i class="direction right">›</i><i class="direction down">⌄</i><i class="direction left">‹</i><div id="joystick-knob" class="joystick-knob"><span></span></div></div><p class="movement-hint">Joystick or WASD to move<br>Mouse drag for camera</p></footer>
    </main>
    <div id="sleep-overlay" role="status" aria-hidden="true"><span>Sleeping</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
